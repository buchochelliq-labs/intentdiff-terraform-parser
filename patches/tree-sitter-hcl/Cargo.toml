[package]
name = "tree-sitter-hcl"
version = "1.1.0"
edition = "2021"
license = "MIT"
# Patched: grammar C sources pre-compiled to lib/libtree_sitter_hcl.a for wasm32-wasip2
# (zig cc, see docs/WASM_BUILD_PATCHES.md). Native builds compile the C sources.
build = "build.rs"
autolib = false

[lib]
name = "tree_sitter_hcl"
path = "bindings/rust/lib.rs"

[dependencies.tree-sitter-language]
version = "0.1"

[build-dependencies]
cc = "1"
